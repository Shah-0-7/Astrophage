name: Auto-process NISAR interferograms

# Every 6 hours: look for recent big earthquakes, find a NISAR GUNW pair that spans each one, build the ground-motion grid
# and upload it to the site. Needs secrets INGEST_SECRET and EARTHDATA_TOKEN and the variable SITE_URL (docs/DISPLACEMENT.md).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      min_mag:
        description: "Smallest earthquake magnitude to look at"
        default: "6.0"
      days:
        description: "How many days back to look"
        default: "45"
      max_new:
        description: "Most new files to process in this run"
        default: "2"
      dry_run:
        description: "Only report what would be processed (no upload)"
        type: boolean
        default: false

concurrency:
  group: auto-grid
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/nisar-grid/requirements.txt
      - run: pip install -r tools/nisar-grid/requirements.txt
      - name: Check the secrets are set
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          [ -n "$SITE_URL" ] || { echo "::error::Repository variable SITE_URL is not set"; exit 1; }
          [ -n "$INGEST_SECRET" ] || { echo "::error::Secret INGEST_SECRET is not set"; exit 1; }
          [ -n "$EARTHDATA_TOKEN" ] || { echo "::error::Secret EARTHDATA_TOKEN is not set (create one at urs.earthdata.nasa.gov/profile)"; exit 1; }
      - name: Process new events
        working-directory: tools/nisar-grid
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          MIN_MAG: ${{ inputs.min_mag || '6.0' }}
          DAYS: ${{ inputs.days || '45' }}
          MAX_NEW: ${{ inputs.max_new || '2' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python auto_ingest.py --site "$SITE_URL" --min-mag "$MIN_MAG" --days "$DAYS" --max-new "$MAX_NEW" $DRY
